[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaf-format"
version = "0.1.0"
description = "KnowAll Format — 自研知识库加密文件格式(MD → .kaf)"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0.0"]

[tool.setuptools]
packages = ["kaf", "kaf.cli"]
