<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'">
<title>连接智识工坊</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#173a35;font:16px/1.65 system-ui,'Microsoft YaHei',sans-serif}main{max-width:520px;margin:58px auto;padding:0 30px}img{width:60px;height:60px}small{display:block;color:#727c74;margin-top:10px}h1{font-size:30px;line-height:1.3;letter-spacing:-1px;margin:24px 0 12px}p{color:#61736b;margin-bottom:30px}label{display:block;font-weight:600;margin-bottom:8px}input{display:block;width:100%;padding:13px 15px;border:1px solid #ccd6cc;border-radius:8px;font:inherit;background:#fff;color:#173a35}input:focus{outline:2px solid #7da985;outline-offset:2px}button{width:100%;padding:13px;border:0;border-radius:8px;background:#1b5247;color:white;font:600 16px system-ui;margin-top:20px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:48px;margin:12px 0;font-size:14px;color:#ad4634}footer{font-size:13px;color:#879187;border-top:1px solid #e1e5da;padding-top:18px;margin-top:12px}
</style></head>
<body><main><img src="assets/icon.png" alt="智识工坊"><small>KNOWALL STUDIO</small><h1>连接你的学习空间</h1><p>输入团队或管理员提供的云服务地址。连接后，即可用账号和密码登录，并在不同设备继续学习。</p>
<form id="connect"><label for="server">云服务地址</label><input id="server" type="url" placeholder="https://你的服务域名" autocomplete="url" required><small>请输入完整的 HTTPS 地址。你的资料和学习记录保存在云服务中。</small><button id="submit" type="submit">连接并登录</button><p id="status" role="status" aria-live="polite"></p></form>
<footer>可从顶部「服务」菜单更换地址。更换时会退出当前账号。<span id="version"></span></footer></main><script src="connection.js"></script></body></html>
